<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Thêm / Sửa Sinh Viên</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 3rem 1rem;
        }
        .form-card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
            <a th:href="@{/students}" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h2 class="h4 fw-bold mb-0 text-dark" th:text="${pageTitle}">Thêm Sinh Viên Mới</h2>
                <small class="text-muted">Nhập thông tin sinh viên vào cơ sở dữ liệu quanlysinhvien</small>
            </div>
        </div>

        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label fw-semibold">Mã Sinh Viên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{studentCode}" class="form-control" placeholder="Ví dụ: SV011" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Ví dụ: a@gmail.com" required>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="Ví dụ: 0901234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Lớp học</label>
                    <input type="text" th:field="*{className}" class="form-control" placeholder="Ví dụ: C2024A">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                <a th:href="@{/students}" class="btn btn-secondary px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary fw-semibold px-4"><i class="bi bi-check2-circle me-1"></i> Lưu thông tin</button>
            </div>
        </form>
    </div>
</body>
</html>
