<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chi Tiết - ' + ${student.fullName}">Chi Tiết Sinh Viên</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 3rem 1rem;
        }
        .detail-card {
            max-width: 620px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="detail-card">
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
            <a th:href="@{/students}" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h2 class="h4 fw-bold mb-0 text-dark">Hồ Sơ Sinh Viên</h2>
                <small class="text-muted">Thông tin chi tiết lưu trong SQL Server</small>
            </div>
        </div>

        <div class="text-center mb-4">
            <div class="avatar bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 76px; height: 76px; font-size: 2rem;">
                <i class="bi bi-person-fill"></i>
            </div>
            <h3 class="fw-bold mb-0 text-dark" th:text="${student.fullName}">Nguyễn Văn A</h3>
            <span class="badge bg-primary font-monospace mt-1 px-3 py-1 fs-6" th:text="${student.studentCode}">SV001</span>
        </div>

        <ul class="list-group list-group-flush border-top border-bottom mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <span class="text-muted"><i class="bi bi-envelope me-2 text-primary"></i>Email</span>
                <span class="fw-semibold text-dark" th:text="${student.email}">a@gmail.com</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <span class="text-muted"><i class="bi bi-telephone me-2 text-primary"></i>Số điện thoại</span>
                <span class="fw-semibold text-dark" th:text="${student.phone != null ? student.phone : '--'}">0901234567</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <span class="text-muted"><i class="bi bi-building me-2 text-primary"></i>Lớp học</span>
                <span class="badge bg-warning text-dark px-3 py-1" th:text="${student.className != null ? student.className : '--'}">C2024A</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <span class="text-muted"><i class="bi bi-key me-2 text-primary"></i>UUID ID</span>
                <span class="small font-monospace text-muted text-break" th:text="${student.id}">--</span>
            </li>
        </ul>

        <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/students}" class="btn btn-secondary px-3"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
            <div class="d-flex gap-2">
                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-primary px-3"><i class="bi bi-pencil-square me-1"></i> Chỉnh sửa</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-outline-danger px-3" onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');"><i class="bi bi-trash me-1"></i> Xóa</a>
            </div>
        </div>
    </div>
</body>
</html>
