# ==========================================================
# Cấu hình kết nối Microsoft SQL Server theo Bước 3 của LAB 03
# Sử dụng khi kích hoạt: ./mvnw spring-boot:run -Dspring-boot.run.profiles=sqlserver
# ==========================================================

spring.application.name=quanlydaotao
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=quanlysinhvien;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
