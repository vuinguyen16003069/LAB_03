# ==========================================================
# Cấu hình ứng dụng Spring Boot - LAB 03 (Production Ready)
# ==========================================================

spring.application.name=schoolmanager
server.port=8080

# Cấu hình Database mặc định (Tự động khởi tạo dữ liệu mẫu, không phụ thuộc service hệ thống)
spring.datasource.url=jdbc:h2:file:./data/schooldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Khởi tạo dữ liệu từ data.sql nếu chưa có dữ liệu
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Cấu hình Thymeleaf (tắt cache để phát triển web nhanh chóng)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cấu hình mã hoá tiếng Việt UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
