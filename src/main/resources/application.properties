# ==========================================================
# Cấu hình ứng dụng Spring Boot - LAB 03 (CRUD API Sinh viên)
# Hỗ trợ nạp cấu hình từ file .env (nếu có)
# ==========================================================

# Nạp file .env ở thư mục gốc dự án (nếu có)
spring.config.import=optional:file:.env[.properties]

spring.application.name=quanlydaotao
server.port=${SERVER_PORT:8080}

# Bước 3: Cấu hình kết nối Microsoft SQL Server từ biến .env / Environment Variables
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:quanlysinhvien};encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cấu hình mã hoá tiếng Việt UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Swagger OpenAPI UI (Bước 9)
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
