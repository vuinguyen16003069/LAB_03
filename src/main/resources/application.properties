# ==========================================================
# Cấu hình ứng dụng Spring Boot - LAB 03 (CRUD API Sinh viên)
# ==========================================================

spring.application.name=quanlydaotao
server.port=8080

# Cấu hình Database mặc định (H2 File với cơ chế tương thích SQL Server, tự nạp 10 sinh viên mẫu)
spring.datasource.url=jdbc:h2:file:./data/quanlysinhvien;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=org.h2.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Khởi tạo dữ liệu từ data.sql (10 sinh viên mẫu chuẩn UUID)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cấu hình mã hoá tiếng Việt UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Swagger OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
